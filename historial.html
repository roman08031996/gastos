<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GastosApp — Historial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    :root{--bg:#0a0c14;--bg2:#0f1220;--surface:#141826;--surface2:#1a2035;--surface3:#222840;
      --border:#2a3050;--accent:#6C63FF;--accent2:#F59E0B;--accent3:#10b981;
      --text:#e2e8f0;--text-muted:#94a3b8;--text-dim:#64748b;
      --radius:14px;--radius-sm:8px;--mono:'JetBrains Mono',monospace;--sans:'Sora',sans-serif;
      --sidebar-w:260px;--topbar-h:64px}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
    .main-content{flex:1;margin-left:var(--sidebar-w);display:flex;flex-direction:column;min-height:100vh}
    .sidebar{position:fixed;top:0;left:0;width:var(--sidebar-w);height:100vh;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:200;transition:transform 0.3s cubic-bezier(.4,0,.2,1)}
    .sidebar-brand{padding:24px 20px 20px;border-bottom:1px solid var(--border)}
    .brand-logo{display:flex;align-items:center;gap:10px;text-decoration:none}
    .brand-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--accent),#9d5cff);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
    .brand-name{font-size:16px;font-weight:700;color:var(--text);letter-spacing:-.3px}
    .brand-name span{color:var(--accent)}
    .sidebar-nav{flex:1;padding:16px 12px;display:flex;flex-direction:column;gap:4px}
    .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);color:var(--text-muted);text-decoration:none;font-size:14px;font-weight:500;transition:all 0.15s;position:relative}
    .nav-item:hover{background:var(--surface2);color:var(--text)}
    .nav-item.active{background:#6C63FF18;color:var(--accent)}
    .nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:60%;background:var(--accent);border-radius:0 3px 3px 0}
    .nav-item i{font-size:17px;width:20px;text-align:center}
    .sidebar-footer{padding:16px 12px;border-top:1px solid var(--border)}
    .sidebar-user{display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--radius-sm);background:var(--surface)}
    .su-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:white}
    .su-info{flex:1;min-width:0}
    .su-name{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .su-role{font-size:11px;color:var(--text-dim)}
    .btn-logout{background:none;border:none;color:var(--text-dim);cursor:pointer;padding:4px;border-radius:6px;transition:color 0.15s;font-size:16px;display:flex}
    .btn-logout:hover{color:#ef4444}
    .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:190;backdrop-filter:blur(2px)}
    .sidebar-overlay.active{display:block}
    .sidebar-close{display:none;position:absolute;top:16px;right:16px;background:none;border:none;color:var(--text-muted);font-size:18px;cursor:pointer;padding:4px;border-radius:6px}
    .sidebar-close:hover{color:var(--text)}
    .topbar{height:var(--topbar-h);background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:0 24px;position:sticky;top:0;z-index:100}
    .menu-btn{display:none;background:none;border:none;color:var(--text-muted);font-size:22px;cursor:pointer;padding:4px;border-radius:6px}
    .menu-btn:hover{color:var(--text)}
    .topbar-title{flex:1;font-size:16px;font-weight:700;color:var(--text)}
    .topbar-actions{display:flex;align-items:center;gap:12px}
    .page-content{padding:28px 24px;flex:1}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;font-family:var(--sans);cursor:pointer;border:none;transition:all .15s;text-decoration:none}
    .btn-primary{background:var(--accent);color:white}.btn-primary:hover{background:#5850e0}
    .btn-sm{padding:7px 12px;font-size:13px}
    .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--text-dim);gap:12px}
    .empty-state i{font-size:48px;opacity:.4}.empty-state p{font-size:15px}
    .btn-add-first{background:var(--accent);color:white;text-decoration:none;padding:10px 20px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;margin-top:4px;transition:background .15s}
    .btn-add-first:hover{background:#5850e0}
    .fab{position:fixed;bottom:28px;right:28px;width:52px;height:52px;background:var(--accent);border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:22px;text-decoration:none;box-shadow:0 4px 24px rgba(108,99,255,.4);transition:transform .2s,box-shadow .2s;z-index:50}
    .fab:hover{transform:scale(1.08);box-shadow:0 8px 32px rgba(108,99,255,.5)}
    .month-group{margin-bottom:32px}
    .month-group-title{display:flex;align-items:baseline;gap:12px;padding:0 0 14px;border-bottom:1px solid var(--border);margin-bottom:16px;font-size:18px;font-weight:700;color:var(--text);text-transform:capitalize}
    .month-total{font-size:13px;font-family:var(--mono);font-weight:500;color:var(--text-muted)}
    .hist-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .hist-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
    .hist-card-label{font-size:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:16px}
    .cat-bar{margin-bottom:8px}
    .cat-bar-header{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
    .cat-bar-icon{display:flex;align-items:center;gap:6px}
    .cat-bar-monto{font-family:var(--mono);font-weight:600}
    .cat-bar-track{height:6px;background:var(--surface3);border-radius:3px;overflow:hidden}
    .cat-bar-fill{height:100%;border-radius:3px;transition:width .8s ease}
    .usr-cards{display:flex;gap:16px;align-items:center;justify-content:space-around;height:80px}
    .usr-card{text-align:center;flex:1}
    .usr-card-name{font-size:12px;color:var(--text-muted);margin-bottom:4px}
    .usr-card-monto{font-family:var(--mono);font-size:16px;font-weight:700}
    .usr-card-pct{font-size:11px;color:var(--text-muted)}
    .usr-divider{width:1px;background:var(--border);align-self:stretch}
    @media(max-width:768px){
      .main-content{margin-left:0}
      .sidebar{transform:translateX(-100%);z-index:220}
      .sidebar.open{transform:translateX(0)}
      .sidebar-close{display:flex}
      .menu-btn{display:flex}
      .page-content{padding:20px 16px}
      .topbar{padding:0 16px}
      .fab{bottom:20px;right:20px}
      .hist-grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="sidebar" id="sidebar">
    <button class="sidebar-close" id="sidebarClose"><i class="bi bi-x-lg"></i></button>
    <div class="sidebar-brand">
      <a href="dashboard.html" class="brand-logo">
        <div class="brand-icon"><i class="bi bi-wallet2" style="color:white"></i></div>
        <span class="brand-name">Gastos<span>App</span></span>
      </a>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item"><i class="bi bi-grid-fill"></i> Dashboard</a>
      <a href="nuevo.html"     class="nav-item"><i class="bi bi-plus-circle-fill"></i> Nuevo gasto</a>
      <a href="gastos.html"    class="nav-item"><i class="bi bi-list-ul"></i> Todos los gastos</a>
      <a href="historial.html" class="nav-item active"><i class="bi bi-clock-history"></i> Historial</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="su-avatar" id="suAvatar">U</div>
        <div class="su-info"><p class="su-name" id="suName">Usuario</p><p class="su-role">Miembro</p></div>
        <button class="btn-logout" onclick="logout()" title="Cerrar sesión"><i class="bi bi-box-arrow-right"></i></button>
      </div>
    </div>
  </aside>

  <div class="main-content">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn"><i class="bi bi-list"></i></button>
      <div class="topbar-title">Historial</div>
      <div class="topbar-actions">
        <a href="nuevo.html" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg"></i> Nuevo</a>
      </div>
    </header>

    <main class="page-content">
      <div id="historialContainer">
        <div class="empty-state"><i class="bi bi-hourglass-split"></i><p>Cargando historial...</p></div>
      </div>
    </main>
  </div>

  <a href="nuevo.html" class="fab" title="Nuevo gasto"><i class="bi bi-plus-lg"></i></a>

  <script>
  const APP_CONFIG = {
    usuarios: ["Juani", "Roman"],
    coloresUsuarios: { "Juani": "#6C63FF", "Roman": "#F59E0B" },
    categorias: {
      "Vivienda":     { icon:"bi-house-fill",       color:"#6C63FF", subcategorias:[] },
      "Alimentación": { icon:"bi-cart-fill",         color:"#10b981", subcategorias:[] },
      "Transporte":   { icon:"bi-car-front-fill",    color:"#F59E0B", subcategorias:[] },
      "Salud":        { icon:"bi-heart-pulse-fill",  color:"#ef4444", subcategorias:[] },
      "Ocio":         { icon:"bi-controller",        color:"#8b5cf6", subcategorias:[] },
      "Ropa":         { icon:"bi-bag-fill",           color:"#ec4899", subcategorias:[] },
      "Educación":    { icon:"bi-book-fill",          color:"#06b6d4", subcategorias:[] },
      "Tecnología":   { icon:"bi-laptop",             color:"#64748b", subcategorias:[] },
      "Otros":        { icon:"bi-three-dots",         color:"#94a3b8", subcategorias:[] }
    }
  };

  function formatMoney(n){return new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',minimumFractionDigits:0}).format(n||0)}
  function monthName(date){return new Intl.DateTimeFormat('es-AR',{month:'long',year:'numeric'}).format(date)}
  function requireAuth(){const u=sessionStorage.getItem("gastos_user");if(!u)window.location.href="index.html";return u}
  function logout(){sessionStorage.clear();window.location.href="index.html"}

  const SHEETS_URL="https://script.google.com/macros/s/AKfycbxBi_2LnML9JiUH_FlIQQ-mvwSYWbYajw7lxa2UKBapD-jLaabhdqeoOfbq-9E8GVY1/exec";

  async function obtenerTodos(){
    const url=new URL(SHEETS_URL);url.searchParams.set("action","getAll");
    const response=await fetch(url.toString());
    if(!response.ok) throw new Error(`HTTP ${response.status}`);
    const data=await response.json();
    if(data.error) throw new Error(data.error);
    return (data.gastos||[]).sort((a,b)=>b.fecha.localeCompare(a.fecha));
  }

  // ===== INIT =====
  const currentUser=requireAuth();
  initSidebar(); initUserBadge();

  (async function load(){
    try{
      const gastos=await obtenerTodos();
      renderHistorial(gastos);
    }catch(e){
      console.error(e);
      document.getElementById("historialContainer").innerHTML=
        `<div class="empty-state"><i class="bi bi-exclamation-triangle"></i><p>Error al cargar. Revisá la conexión con la hoja.</p></div>`;
    }
    setTimeout(load,60000);
  })();

  function initSidebar(){
    const sidebar=document.getElementById("sidebar"),overlay=document.getElementById("sidebarOverlay"),
      menuBtn=document.getElementById("menuBtn"),closeBtn=document.getElementById("sidebarClose");
    menuBtn?.addEventListener("click",()=>{sidebar.classList.add("open");overlay.classList.add("active")});
    [overlay,closeBtn].forEach(el=>el?.addEventListener("click",()=>{sidebar.classList.remove("open");overlay.classList.remove("active")}));
  }
  function initUserBadge(){
    const color=sessionStorage.getItem("gastos_color")||"#6C63FF";
    const avatar=document.getElementById("suAvatar"),name=document.getElementById("suName");
    if(avatar){avatar.style.background=`linear-gradient(135deg,${color},${color}88)`;avatar.textContent=currentUser.charAt(0).toUpperCase()}
    if(name) name.textContent=currentUser;
  }

  function renderHistorial(gastos){
    const container=document.getElementById("historialContainer");
    if(gastos.length===0){
      container.innerHTML=`<div class="empty-state"><i class="bi bi-inbox"></i><p>Sin gastos registrados aún</p><a href="nuevo.html" class="btn-add-first">Agregar el primero</a></div>`;return;
    }
    const porMes={};
    gastos.forEach(g=>{
      if(!g.fecha)return;
      const key=g.fecha.substring(0,7);
      if(!porMes[key])porMes[key]=[];
      porMes[key].push(g);
    });
    const mesesOrdenados=Object.keys(porMes).sort().reverse();

    container.innerHTML=mesesOrdenados.map(key=>{
      const[y,m]=key.split("-").map(Number);
      const nombreMes=monthName(new Date(y,m-1,1));
      const items=porMes[key];
      const totalMes=items.reduce((s,g)=>s+(g.monto||0),0);

      const porCat={};
      items.forEach(g=>{const c=g.categoria||"Otros";if(!porCat[c])porCat[c]=0;porCat[c]+=g.monto});

      const porUsr={};
      APP_CONFIG.usuarios.forEach(u=>{porUsr[u]=0});
      items.forEach(g=>{if(g.quienGasto)porUsr[g.quienGasto]=(porUsr[g.quienGasto]||0)+g.monto});

      const catBars=Object.entries(porCat).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([cat,monto])=>{
        const catData=APP_CONFIG.categorias[cat]||APP_CONFIG.categorias["Otros"];
        const pct=totalMes>0?(monto/totalMes*100).toFixed(0):0;
        return `<div class="cat-bar">
          <div class="cat-bar-header">
            <span class="cat-bar-icon"><i class="bi ${catData.icon}" style="color:${catData.color}"></i> ${cat}</span>
            <span class="cat-bar-monto">${formatMoney(monto)}</span>
          </div>
          <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${pct}%;background:${catData.color}"></div></div>
        </div>`;
      }).join("");

      const usrCards=APP_CONFIG.usuarios.map((u,i)=>{
        const monto=porUsr[u]||0;
        const pct=totalMes>0?(monto/totalMes*100).toFixed(0):0;
        const colors=["var(--accent)","var(--accent2)"];
        return `<div class="usr-card">
          <p class="usr-card-name">${u}</p>
          <p class="usr-card-monto" style="color:${colors[i]}">${formatMoney(monto)}</p>
          <p class="usr-card-pct">${pct}%</p>
        </div>`;
      }).join(`<div class="usr-divider"></div>`);

      return `<div class="month-group">
        <div class="month-group-title">
          <span>${nombreMes}</span>
          <span class="month-total">${formatMoney(totalMes)} · ${items.length} gastos</span>
        </div>
        <div class="hist-grid">
          <div class="hist-card">
            <p class="hist-card-label">Por categoría</p>
            ${catBars||'<p style="color:var(--text-dim);font-size:13px">Sin datos</p>'}
          </div>
          <div class="hist-card">
            <p class="hist-card-label">Por usuario</p>
            <div class="usr-cards">${usrCards}</div>
            <div style="margin-top:16px">
              <a href="gastos.html" style="font-size:12px;color:var(--accent);text-decoration:none">Ver detalle <i class="bi bi-arrow-right-short"></i></a>
            </div>
          </div>
        </div>
      </div>`;
    }).join("");
  }
  </script>
</body>
</html>
