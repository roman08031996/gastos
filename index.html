<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GastosApp — Ingresar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    :root {
      --bg:#0a0c14;--bg2:#0f1220;--surface:#141826;--surface2:#1a2035;
      --surface3:#222840;--border:#2a3050;--accent:#6C63FF;--accent2:#F59E0B;
      --text:#e2e8f0;--text-muted:#94a3b8;--text-dim:#64748b;
      --radius:16px;--radius-sm:10px;
      --mono:'JetBrains Mono',monospace;--sans:'Sora',sans-serif;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;
      display:flex;align-items:center;justify-content:center;-webkit-font-smoothing:antialiased;overflow:hidden}
    body::before{content:'';position:fixed;inset:0;background:
      radial-gradient(ellipse 60% 50% at 20% 20%,rgba(108,99,255,.12) 0%,transparent 60%),
      radial-gradient(ellipse 50% 40% at 80% 80%,rgba(245,158,11,.08) 0%,transparent 60%);
      pointer-events:none}
    .login-wrap{width:100%;max-width:420px;padding:24px;position:relative;z-index:1}
    .login-logo{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:40px}
    .logo-icon{width:60px;height:60px;background:linear-gradient(135deg,var(--accent),#9d5cff);
      border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:28px;
      color:white;box-shadow:0 8px 32px rgba(108,99,255,.35)}
    .logo-title{font-size:22px;font-weight:700;color:var(--text);letter-spacing:-.5px}
    .logo-title span{color:var(--accent)}
    .logo-sub{font-size:13px;color:var(--text-muted);margin-top:-6px}
    .selector-label{font-size:12px;color:var(--text-dim);text-transform:uppercase;
      letter-spacing:1px;text-align:center;margin-bottom:14px}
    .user-selector{display:flex;gap:12px}
    .user-btn{flex:1;background:var(--surface);border:1px solid var(--border);
      border-radius:var(--radius);padding:20px 16px;display:flex;flex-direction:column;
      align-items:center;gap:10px;cursor:pointer;transition:all 0.2s;
      font-family:var(--sans);color:var(--text)}
    .user-btn:hover{border-color:var(--accent);background:var(--surface2);transform:translateY(-2px)}
    .user-avatar{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;
      justify-content:center;font-size:20px;font-weight:700;color:white}
    .user-btn-name{font-size:14px;font-weight:600}
    #pinSection{display:none}
    .pin-header{text-align:center;margin-bottom:28px}
    .pin-user-name{font-size:18px;font-weight:700;color:var(--text);margin-bottom:4px}
    .pin-hint{font-size:13px;color:var(--text-muted)}
    .pin-display{display:flex;justify-content:center;gap:14px;margin-bottom:32px}
    .pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--border);
      background:transparent;transition:all 0.15s}
    .pin-dot.filled{background:var(--accent);border-color:var(--accent);transform:scale(1.15)}
    .pin-keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .pin-key{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
      color:var(--text);font-family:var(--mono);font-size:20px;font-weight:600;padding:16px;
      cursor:pointer;transition:all 0.12s;text-align:center}
    .pin-key:hover{background:var(--surface2);border-color:var(--accent)}
    .pin-key:active{transform:scale(0.94)}
    .pin-key.pin-action{font-size:16px;font-family:var(--sans);color:var(--text-muted)}
    .pin-key.pin-ok{background:var(--accent);border-color:var(--accent);color:white;font-size:18px}
    .pin-key.pin-ok:hover{background:#5850e0}
    .error-toast{background:#ef444420;border:1px solid #ef444440;color:#ef4444;
      border-radius:var(--radius-sm);padding:10px 16px;font-size:13px;text-align:center;
      display:none;margin-bottom:16px;animation:shake 0.4s ease}
    @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
    .btn-back{width:100%;background:none;border:1px solid var(--border);border-radius:var(--radius-sm);
      color:var(--text-muted);font-family:var(--sans);font-size:13px;padding:10px;
      cursor:pointer;margin-top:16px;transition:all 0.15s}
    .btn-back:hover{color:var(--text);border-color:var(--text-muted)}
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-logo">
      <div class="logo-icon"><i class="bi bi-wallet2"></i></div>
      <div>
        <p class="logo-title">Gastos<span>App</span></p>
        <p class="logo-sub">Control de gastos compartidos</p>
      </div>
    </div>

    <p class="selector-label" id="selectorLabelText">¿Quién sos?</p>
    <div class="user-selector" id="userSelector"></div>

    <div id="pinSection">
      <div class="pin-header">
        <p class="pin-user-name" id="pinUserName"></p>
        <p class="pin-hint">Ingresá tu PIN de 4 dígitos</p>
      </div>
      <div id="errorToast" class="error-toast"><i class="bi bi-x-circle-fill"></i> PIN incorrecto</div>
      <div class="pin-display" id="pinDisplay">
        <div class="pin-dot"></div><div class="pin-dot"></div>
        <div class="pin-dot"></div><div class="pin-dot"></div>
      </div>
      <div class="pin-keypad">
        <button class="pin-key" data-val="1">1</button>
        <button class="pin-key" data-val="2">2</button>
        <button class="pin-key" data-val="3">3</button>
        <button class="pin-key" data-val="4">4</button>
        <button class="pin-key" data-val="5">5</button>
        <button class="pin-key" data-val="6">6</button>
        <button class="pin-key" data-val="7">7</button>
        <button class="pin-key" data-val="8">8</button>
        <button class="pin-key" data-val="9">9</button>
        <button class="pin-key pin-action" id="pinClear"><i class="bi bi-delete"></i></button>
        <button class="pin-key" data-val="0">0</button>
        <button class="pin-key pin-ok" id="pinOk"><i class="bi bi-check-lg"></i></button>
      </div>
      <button class="btn-back" id="btnBack"><i class="bi bi-arrow-left"></i> Cambiar usuario</button>
    </div>
  </div>

  <script>
    // ===== CONFIG =====
    const APP_CONFIG = {
      usuarios: ["Usuario 1", "Usuario 2"],
      coloresUsuarios: { "Usuario 1": "#6C63FF", "Usuario 2": "#F59E0B" }
    };
    const USERS = {
      "Juani": { pin: "1234", color: "#6C63FF" },
      "Roman": { pin: "1234", color: "#F59E0B" }
    };

    // Redirigir si ya hay sesión
    if (sessionStorage.getItem("gastos_user")) {
      window.location.href = "dashboard.html";
    }

    // Generar botones de usuario
    const userSelector = document.getElementById("userSelector");
    APP_CONFIG.usuarios.forEach(u => {
      const btn = document.createElement("button");
      btn.className = "user-btn";
      btn.dataset.user = u;
      const color = APP_CONFIG.coloresUsuarios[u] || "#6C63FF";
      const initial = u.charAt(0).toUpperCase();
      btn.innerHTML = `
        <div class="user-avatar" style="background:linear-gradient(135deg,${color},${color}88)">${initial}</div>
        <span class="user-btn-name">${u}</span>`;
      userSelector.appendChild(btn);
    });

    // ===== LOGIN JS =====
    let selectedUser = null;
    let pinInput = "";

    const pinSection    = document.getElementById("pinSection");
    const pinUserName   = document.getElementById("pinUserName");
    const pinDisplay    = document.getElementById("pinDisplay");
    const errorToast    = document.getElementById("errorToast");
    const pinDots       = pinDisplay.querySelectorAll(".pin-dot");
    const selectorLabel = document.getElementById("selectorLabelText");

    userSelector.querySelectorAll(".user-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        selectedUser = btn.dataset.user;
        pinUserName.textContent = selectedUser;
        pinSection.style.display = "block";
        selectorLabel.style.display = "none";
        userSelector.style.display = "none";
        pinInput = "";
        updateDots();
        errorToast.style.display = "none";
      });
    });

    document.querySelectorAll(".pin-key[data-val]").forEach(key => {
      key.addEventListener("click", () => {
        if (pinInput.length < 4) {
          pinInput += key.dataset.val;
          updateDots();
          if (pinInput.length === 4) validatePin();
        }
      });
    });

    document.getElementById("pinClear").addEventListener("click", () => {
      pinInput = pinInput.slice(0, -1);
      updateDots();
      errorToast.style.display = "none";
    });

    document.getElementById("pinOk").addEventListener("click", () => {
      if (pinInput.length === 4) validatePin();
    });

    document.getElementById("btnBack").addEventListener("click", () => {
      pinSection.style.display = "none";
      userSelector.style.display = "flex";
      selectorLabel.style.display = "block";
      pinInput = "";
      updateDots();
      errorToast.style.display = "none";
    });

    function updateDots() {
      pinDots.forEach((dot, i) => dot.classList.toggle("filled", i < pinInput.length));
    }

    function validatePin() {
      const user = USERS[selectedUser];
      if (!user) return;
      if (pinInput === user.pin) {
        sessionStorage.setItem("gastos_user", selectedUser);
        sessionStorage.setItem("gastos_color", user.color);
        window.location.href = "dashboard.html";
      } else {
        errorToast.style.display = "block";
        pinInput = "";
        updateDots();
        errorToast.style.animation = "none";
        setTimeout(() => { errorToast.style.animation = ""; }, 10);
      }
    }
  </script>
</body>
</html>
