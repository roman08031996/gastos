<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GastosApp — Nuevo Gasto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <style>
    :root{--bg:#0a0c14;--bg2:#0f1220;--surface:#141826;--surface2:#1a2035;--surface3:#222840;
      --border:#2a3050;--accent:#6C63FF;--accent2:#F59E0B;--accent3:#10b981;
      --text:#e2e8f0;--text-muted:#94a3b8;--text-dim:#64748b;
      --radius:14px;--radius-sm:8px;--mono:'JetBrains Mono',monospace;--sans:'Sora',sans-serif;
      --sidebar-w:260px;--topbar-h:64px}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
    .main-content{flex:1;margin-left:var(--sidebar-w);display:flex;flex-direction:column;min-height:100vh}
    .sidebar{position:fixed;top:0;left:0;width:var(--sidebar-w);height:100vh;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:200;transition:transform 0.3s cubic-bezier(.4,0,.2,1)}
    .sidebar-brand{padding:24px 20px 20px;border-bottom:1px solid var(--border)}
    .brand-logo{display:flex;align-items:center;gap:10px;text-decoration:none}
    .brand-icon{width:36px;height:36px;background:linear-gradient(135deg,var(--accent),#9d5cff);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
    .brand-name{font-size:16px;font-weight:700;color:var(--text);letter-spacing:-.3px}
    .brand-name span{color:var(--accent)}
    .sidebar-nav{flex:1;padding:16px 12px;display:flex;flex-direction:column;gap:4px}
    .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);color:var(--text-muted);text-decoration:none;font-size:14px;font-weight:500;transition:all 0.15s;position:relative}
    .nav-item:hover{background:var(--surface2);color:var(--text)}
    .nav-item.active{background:#6C63FF18;color:var(--accent)}
    .nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:60%;background:var(--accent);border-radius:0 3px 3px 0}
    .nav-item i{font-size:17px;width:20px;text-align:center}
    .sidebar-footer{padding:16px 12px;border-top:1px solid var(--border)}
    .sidebar-user{display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--radius-sm);background:var(--surface)}
    .su-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:white}
    .su-info{flex:1;min-width:0}
    .su-name{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .su-role{font-size:11px;color:var(--text-dim)}
    .btn-logout{background:none;border:none;color:var(--text-dim);cursor:pointer;padding:4px;border-radius:6px;transition:color 0.15s;font-size:16px;display:flex}
    .btn-logout:hover{color:#ef4444}
    .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:190;backdrop-filter:blur(2px)}
    .sidebar-overlay.active{display:block}
    .sidebar-close{display:none;position:absolute;top:16px;right:16px;background:none;border:none;color:var(--text-muted);font-size:18px;cursor:pointer;padding:4px;border-radius:6px}
    .sidebar-close:hover{color:var(--text)}
    .topbar{height:var(--topbar-h);background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:16px;padding:0 24px;position:sticky;top:0;z-index:100}
    .menu-btn{display:none;background:none;border:none;color:var(--text-muted);font-size:22px;cursor:pointer;padding:4px;border-radius:6px}
    .menu-btn:hover{color:var(--text)}
    .topbar-title{flex:1;font-size:16px;font-weight:700;color:var(--text)}
    .topbar-actions{display:flex;align-items:center;gap:12px}
    .page-content{padding:28px 24px;flex:1}
    .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px}
    .form-group{margin-bottom:18px}
    .form-label{display:block;font-size:13px;font-weight:600;color:var(--text-muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
    .form-control{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:var(--sans);font-size:14px;padding:11px 14px;transition:border-color 0.15s;outline:none;appearance:none}
    .form-control:focus{border-color:var(--accent)}
    .form-control::placeholder{color:var(--text-dim)}
    .form-control.is-invalid{border-color:#ef4444}
    .form-error{font-size:12px;color:#ef4444;margin-top:5px;display:none}
    .monto-preview{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;display:none;align-items:center;justify-content:space-between;margin-bottom:16px}
    .preview-amount{font-family:var(--mono);font-size:24px;font-weight:700;color:var(--accent3)}
    .preview-cat{font-size:14px;color:var(--text-muted);display:flex;align-items:center;gap:6px}
    .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;font-family:var(--sans);cursor:pointer;border:none;transition:all 0.15s;text-decoration:none}
    .btn-primary{background:var(--accent);color:white}
    .btn-primary:hover{background:#5850e0}
    .btn-secondary{background:var(--surface2);color:var(--text-muted);border:1px solid var(--border)}
    .btn-secondary:hover{color:var(--text);background:var(--surface3)}
    .btn-sm{padding:7px 12px;font-size:13px}
    .btn:disabled{opacity:.6;cursor:not-allowed}
    .spinner-border{display:inline-block;width:1rem;height:1rem;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .6s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .app-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface2);border:1px solid var(--border);border-radius:40px;padding:12px 24px;font-size:14px;font-weight:500;color:var(--text);display:flex;align-items:center;gap:10px;z-index:9999;box-shadow:0 8px 40px rgba(0,0,0,.4);transition:transform 0.35s cubic-bezier(.4,0,.2,1);white-space:nowrap}
    .app-toast.show{transform:translateX(-50%) translateY(0)}
    @media(max-width:768px){
      .main-content{margin-left:0}
      .sidebar{transform:translateX(-100%);z-index:220}
      .sidebar.open{transform:translateX(0)}
      .sidebar-close{display:flex}
      .menu-btn{display:flex}
      .page-content{padding:20px 16px}
      .topbar{padding:0 16px}
      .grid-2{grid-template-columns:1fr!important}
    }
  </style>
</head>
<body>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>
  <aside class="sidebar" id="sidebar">
    <button class="sidebar-close" id="sidebarClose"><i class="bi bi-x-lg"></i></button>
    <div class="sidebar-brand">
      <a href="dashboard.html" class="brand-logo">
        <div class="brand-icon"><i class="bi bi-wallet2" style="color:white"></i></div>
        <span class="brand-name">Gastos<span>App</span></span>
      </a>
    </div>
    <nav class="sidebar-nav">
      <a href="dashboard.html" class="nav-item"><i class="bi bi-grid-fill"></i> Dashboard</a>
      <a href="nuevo.html"     class="nav-item active"><i class="bi bi-plus-circle-fill"></i> Nuevo gasto</a>
      <a href="gastos.html"    class="nav-item"><i class="bi bi-list-ul"></i> Todos los gastos</a>
      <a href="historial.html" class="nav-item"><i class="bi bi-clock-history"></i> Historial</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="su-avatar" id="suAvatar">U</div>
        <div class="su-info"><p class="su-name" id="suName">Usuario</p><p class="su-role">Miembro</p></div>
        <button class="btn-logout" onclick="logout()" title="Cerrar sesión"><i class="bi bi-box-arrow-right"></i></button>
      </div>
    </div>
  </aside>

  <div class="main-content">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn"><i class="bi bi-list"></i></button>
      <div class="topbar-title">Nuevo gasto</div>
      <div class="topbar-actions">
        <a href="dashboard.html" class="btn btn-secondary btn-sm"><i class="bi bi-arrow-left"></i> Volver</a>
      </div>
    </header>

    <main class="page-content">
      <div style="max-width:640px">
        <div class="monto-preview" id="montoPreview">
          <div>
            <p style="font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px">Vas a registrar</p>
            <p class="preview-amount" id="previewMonto">$0</p>
          </div>
          <p class="preview-cat" id="previewCat">—</p>
        </div>

        <div class="card">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px" class="grid-2">
            <div class="form-group">
              <label class="form-label">¿Quién gastó?</label>
              <select class="form-control" id="quienGasto"></select>
              <p class="form-error" id="errQuien">Seleccioná un usuario</p>
            </div>
            <div class="form-group">
              <label class="form-label">Monto (ARS)</label>
              <input type="number" class="form-control" id="monto" placeholder="0" min="0" step="1" />
              <p class="form-error" id="errMonto">Ingresá un monto válido</p>
            </div>
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px" class="grid-2">
            <div class="form-group">
              <label class="form-label">Categoría</label>
              <select class="form-control" id="categoria"></select>
              <p class="form-error" id="errCat">Seleccioná una categoría</p>
            </div>
            <div class="form-group">
              <label class="form-label">Subcategoría</label>
              <select class="form-control" id="subcategoria"></select>
            </div>
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px" class="grid-2">
            <div class="form-group">
              <label class="form-label">Tipo / Comercio</label>
              <input type="text" class="form-control" id="tipo" placeholder="Ej: Carrefour, Netflix..." />
            </div>
            <div class="form-group">
              <label class="form-label">Fecha</label>
              <input type="date" class="form-control" id="fecha" />
              <p class="form-error" id="errFecha">Seleccioná una fecha</p>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Descripción <span style="font-weight:400;color:var(--text-dim)">(opcional)</span></label>
            <textarea class="form-control" id="descripcion" rows="3" placeholder="Notas adicionales..." style="resize:vertical"></textarea>
          </div>

          <div style="display:flex;gap:12px;justify-content:flex-end;padding-top:8px">
            <button type="button" class="btn btn-secondary" onclick="resetForm()"><i class="bi bi-arrow-counterclockwise"></i> Limpiar</button>
            <button type="button" class="btn btn-primary" id="btnSubmit" onclick="submitForm()"><i class="bi bi-check-lg"></i> Guardar gasto</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script>
  // ===== CONFIG =====
  const APP_CONFIG = {
    usuarios: ["Usuario 1", "Usuario 2"],
    coloresUsuarios: { "Usuario 1": "#6C63FF", "Usuario 2": "#F59E0B" },
    categorias: {
      "Vivienda":     { icon:"bi-house-fill",       color:"#6C63FF", subcategorias:["Alquiler","Expensas","Servicios","Internet","Limpieza","Mantenimiento"] },
      "Alimentación": { icon:"bi-cart-fill",         color:"#10b981", subcategorias:["Supermercado","Verdulería","Carnicería","Almacén","Delivery","Restaurante"] },
      "Transporte":   { icon:"bi-car-front-fill",    color:"#F59E0B", subcategorias:["Nafta","Peajes","Subte/Colectivo","Taxi/Uber","Estacionamiento","Mecánico"] },
      "Salud":        { icon:"bi-heart-pulse-fill",  color:"#ef4444", subcategorias:["Farmacia","Médico","Obra social","Dentista","Gimnasio"] },
      "Ocio":         { icon:"bi-controller",        color:"#8b5cf6", subcategorias:["Cine/Teatro","Salidas","Streaming","Hobbies","Vacaciones"] },
      "Ropa":         { icon:"bi-bag-fill",           color:"#ec4899", subcategorias:["Ropa","Calzado","Accesorios"] },
      "Educación":    { icon:"bi-book-fill",          color:"#06b6d4", subcategorias:["Cursos","Libros","Suscripciones","Universidad"] },
      "Tecnología":   { icon:"bi-laptop",             color:"#64748b", subcategorias:["Hardware","Software","Celular","Gadgets"] },
      "Otros":        { icon:"bi-three-dots",         color:"#94a3b8", subcategorias:["General","Imprevistos","Regalos"] }
    }
  };

  function formatMoney(n){return new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',minimumFractionDigits:0}).format(n||0)}
  function requireAuth(){const u=sessionStorage.getItem("gastos_user");if(!u)window.location.href="index.html";return u}
  function logout(){sessionStorage.clear();window.location.href="index.html"}
  function showToast(msg,type="success"){
    const colors={success:["#10b981","bi-check-circle-fill"],error:["#ef4444","bi-x-circle-fill"],info:["#6C63FF","bi-info-circle-fill"],warn:["#F59E0B","bi-exclamation-triangle-fill"]};
    const[color,icon]=colors[type]||colors.success;
    const el=document.createElement("div");el.className="app-toast";
    el.innerHTML=`<i class="bi ${icon}" style="color:${color}"></i> ${msg}`;
    document.body.appendChild(el);
    requestAnimationFrame(()=>el.classList.add("show"));
    setTimeout(()=>{el.classList.remove("show");el.addEventListener("transitionend",()=>el.remove())},3200);
  }

  const SHEETS_URL="https://script.google.com/macros/s/AKfycbxBi_2LnML9JiUH_FlIQQ-mvwSYWbYajw7lxa2UKBapD-jLaabhdqeoOfbq-9E8GVY1/exec";

  function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

  async function crearGasto(data) {
    const gasto={id:genId(),tipo:data.tipo||"",categoria:data.categoria||"",subcategoria:data.subcategoria||"",
      quienGasto:data.quienGasto||"",monto:parseFloat(data.monto)||0,fecha:data.fecha||"",
      descripcion:data.descripcion||"",creadoEn:new Date().toISOString()};
    // GET con query string: sin preflight CORS y sin confusión de postData en GAS
    const url=new URL(SHEETS_URL);
    url.searchParams.set("action","create");
    url.searchParams.set("gasto",JSON.stringify(gasto));
    const response=await fetch(url.toString());
    if(!response.ok) throw new Error(`HTTP ${response.status}`);
    const result=await response.json();
    if(result.error) throw new Error(result.error);
    return gasto;
  }

  // ===== INIT =====
  const currentUser=requireAuth();
  initSidebar(); initUserBadge(); buildSelects();
  document.getElementById("fecha").value=new Date().toISOString().split("T")[0];

  function initSidebar(){
    const sidebar=document.getElementById("sidebar"),overlay=document.getElementById("sidebarOverlay"),
      menuBtn=document.getElementById("menuBtn"),closeBtn=document.getElementById("sidebarClose");
    menuBtn?.addEventListener("click",()=>{sidebar.classList.add("open");overlay.classList.add("active")});
    [overlay,closeBtn].forEach(el=>el?.addEventListener("click",()=>{sidebar.classList.remove("open");overlay.classList.remove("active")}));
  }
  function initUserBadge(){
    const color=sessionStorage.getItem("gastos_color")||"#6C63FF";
    const avatar=document.getElementById("suAvatar"),name=document.getElementById("suName");
    if(avatar){avatar.style.background=`linear-gradient(135deg,${color},${color}88)`;avatar.textContent=currentUser.charAt(0).toUpperCase()}
    if(name) name.textContent=currentUser;
  }

  function buildSelects(){
    const selUsr=document.getElementById("quienGasto");
    APP_CONFIG.usuarios.forEach(u=>{
      const opt=document.createElement("option");opt.value=u;opt.textContent=u;
      if(u===currentUser)opt.selected=true;selUsr.appendChild(opt);
    });
    const selCat=document.getElementById("categoria");
    Object.entries(APP_CONFIG.categorias).forEach(([nombre])=>{
      const opt=document.createElement("option");opt.value=nombre;opt.textContent=nombre;selCat.appendChild(opt);
    });
    selCat.addEventListener("change",()=>{
      const subcats=APP_CONFIG.categorias[selCat.value]?.subcategorias||[];
      const selSub=document.getElementById("subcategoria");
      selSub.innerHTML="";selSub.disabled=subcats.length===0;
      subcats.forEach(s=>{const o=document.createElement("option");o.value=s;o.textContent=s;selSub.appendChild(o)});
      updatePreview();
    });
    selCat.dispatchEvent(new Event("change"));
  }

  function updatePreview(){
    const monto=parseFloat(document.getElementById("monto").value);
    const cat=document.getElementById("categoria").value;
    const prev=document.getElementById("montoPreview");
    if(!monto||monto<=0||!cat){if(prev)prev.style.display="none";return}
    const catData=APP_CONFIG.categorias[cat]||APP_CONFIG.categorias["Otros"];
    if(prev)prev.style.display="flex";
    document.getElementById("previewMonto").textContent=formatMoney(monto);
    document.getElementById("previewCat").innerHTML=`<i class="bi ${catData.icon}" style="color:${catData.color}"></i> ${cat}`;
  }

  document.getElementById("monto")?.addEventListener("input",updatePreview);
  document.getElementById("categoria")?.addEventListener("change",updatePreview);

  async function submitForm(){
    if(!validate()) return;
    const btn=document.getElementById("btnSubmit");
    btn.disabled=true;
    btn.innerHTML='<span class="spinner-border"></span> Guardando...';
    try {
      await crearGasto({
        quienGasto:document.getElementById("quienGasto").value,
        monto:document.getElementById("monto").value,
        categoria:document.getElementById("categoria").value,
        subcategoria:document.getElementById("subcategoria").value,
        fecha:document.getElementById("fecha").value,
        tipo:document.getElementById("tipo").value,
        descripcion:document.getElementById("descripcion").value
      });
      showToast("¡Gasto guardado correctamente!","success");
      setTimeout(()=>{window.location.href="dashboard.html"},1200);
    } catch(err){
      console.error(err);
      showToast("Error al guardar. Verificá la conexión con la hoja.","error");
      btn.disabled=false;
      btn.innerHTML='<i class="bi bi-check-lg"></i> Guardar gasto';
    }
  }

  function validate(){
    let ok=true;
    const fields=[
      {id:"quienGasto",errId:"errQuien",check:v=>v!==""},
      {id:"monto",errId:"errMonto",check:v=>parseFloat(v)>0},
      {id:"categoria",errId:"errCat",check:v=>v!==""},
      {id:"fecha",errId:"errFecha",check:v=>v!==""}
    ];
    fields.forEach(({id,errId,check})=>{
      const el=document.getElementById(id),err=document.getElementById(errId);
      if(!check(el?.value||"")){el?.classList.add("is-invalid");if(err)err.style.display="block";ok=false}
      else{el?.classList.remove("is-invalid");if(err)err.style.display="none"}
    });
    return ok;
  }

  function resetForm(){
    ["quienGasto","monto","categoria","subcategoria","tipo","fecha","descripcion"].forEach(id=>{
      const el=document.getElementById(id);
      if(el){if(el.tagName==="TEXTAREA"||el.type==="text"||el.type==="number")el.value="";else if(el.tagName==="SELECT")el.selectedIndex=0}
    });
    document.getElementById("fecha").value=new Date().toISOString().split("T")[0];
    document.getElementById("montoPreview").style.display="none";
    document.querySelectorAll(".is-invalid").forEach(el=>el.classList.remove("is-invalid"));
    document.querySelectorAll(".form-error").forEach(el=>el.style.display="none");
  }
  </script>
</body>
</html>
